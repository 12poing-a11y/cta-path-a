name: CTA Daily 15:30 CST

on:
  schedule:
    # 北京时间工作日 15:30 = UTC 07:30
    - cron: "30 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Fetch signals
        env:
          IFIND_AUTH_TOKEN: ${{ secrets.IFIND_AUTH_TOKEN }}
          IFIND_AUTH_TOKEN_BACKUP: ${{ secrets.IFIND_AUTH_TOKEN_BACKUP }}
          IFIND_ACTIVE_SLOT: primary
          IFIND_USER_AGENT: github-actions
        run: python daily_update.py

      - name: Sync Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          IFIND_ACTIVE_SLOT: primary
        run: python notion_sync.py signals

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cta-daily-${{ github.run_id }}
          path: |
            l1_report_risk15.json
            archive/
          if-no-files-found: warn

      - name: Commit archive (optional)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        continue-on-error: true
        run: |
          git config user.name "cta-bot"
          git config user.email "cta-bot@users.noreply.github.com"
          git add archive/*.json l1_report_risk15.json l1_report.json || true
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore(cta): daily $(date -u +%Y%m%d)"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git push origin "HEAD:${{ github.ref_name }}"
