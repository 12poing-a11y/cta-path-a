name: Gamma Wall daily collection

on:
  schedule:
    # 16:35 China time, after the CZCE day session (08:35 UTC), weekdays.
    - cron: "35 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gamma-wall-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install free data dependencies
        run: pip install -r requirements.txt
      - name: Collect validated snapshots
        env:
          GAMMA_CF2701_EXPIRY: ${{ vars.GAMMA_CF2701_EXPIRY }}
          GAMMA_SR2701_EXPIRY: ${{ vars.GAMMA_SR2701_EXPIRY }}
          GAMMA_MA2701_EXPIRY: ${{ vars.GAMMA_MA2701_EXPIRY }}
          GAMMA_TA2701_EXPIRY: ${{ vars.GAMMA_TA2701_EXPIRY }}
          GAMMA_SA2701_EXPIRY: ${{ vars.GAMMA_SA2701_EXPIRY }}
          GAMMA_RM2701_EXPIRY: ${{ vars.GAMMA_RM2701_EXPIRY }}
          GAMMA_OI2701_EXPIRY: ${{ vars.GAMMA_OI2701_EXPIRY }}
          GAMMA_FG2701_EXPIRY: ${{ vars.GAMMA_FG2701_EXPIRY }}
          # Exact-contract futures gap-fill (optional; AkShare/Sina remains primary).
          FUYAO_API_KEY: ${{ secrets.FUYAO_API_KEY }}
          TQ_USER: ${{ secrets.TQ_USER }}
          TQ_PASS: ${{ secrets.TQ_PASS }}
        run: |
          set -euo pipefail
          ASOF="$(TZ=Asia/Shanghai date +%F)"
          RAN=0
          for CONTRACT in CF2701 SR2701 MA2701 TA2701 SA2701 RM2701 OI2701 FG2701; do
            VAR="GAMMA_${CONTRACT}_EXPIRY"
            EXPIRY="${!VAR:-}"
            if [[ -n "$EXPIRY" ]]; then
              python gamma_wall.py --contract "$CONTRACT" --expiry "$EXPIRY" --date "$ASOF"
              RAN=1
            else
              echo "::notice::Skip ${CONTRACT}: set repository variable ${VAR} after verifying CZCE option last trading day."
            fi
          done
          if [[ "$RAN" -eq 0 ]]; then
            echo "::error title=Gamma Wall collected nothing::No GAMMA_*_EXPIRY repository Variables are set, so zero snapshots were generated. Set e.g. GAMMA_CF2701_EXPIRY=YYYY-MM-DD (verified CZCE option last trading day) under Settings > Secrets and variables > Actions > Variables. Failing so green != empty."
            exit 1
          fi
      - name: Persist validated daily snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gamma_wall/
          if git diff --cached --quiet; then
            echo "No new validated Gamma Wall snapshots to commit."
          else
            git commit -m "data(gamma): daily validated wall snapshots"
            git push
          fi
