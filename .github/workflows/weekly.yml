name: CTA Weekly Backtest Sun 09:00 CST

on:
  schedule:
    # 北京时间周日 09:00 = UTC 01:00
    - cron: "0 1 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    # Member backfill (DCE/EM lookback) + paper PnL.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Run weekly (PnL + seat backfill)
        env:
          IFIND_ACTIVE_SLOT: primary
        run: python weekly_backtest.py

      - name: Sync Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          IFIND_ACTIVE_SLOT: primary
        run: python notion_sync.py backtest

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cta-weekly-${{ github.run_id }}
          path: |
            weekly_backtest_latest.json
            .cache/member/dce-*.json
            .cache/member/em-*.json
            .cache/member/shfe-*.txt
            .cache/member/czce-*.txt
          if-no-files-found: warn

      - name: Commit backtest + member cache
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        continue-on-error: true
        run: |
          git config user.name "cta-bot"
          git config user.email "cta-bot@users.noreply.github.com"
          mkdir -p .cache/member
          git add weekly_backtest_latest.json equity_state.json archive/*.json || true
          # Densified seats for local git pull (esp. DCE/EM gaps).
          git add -f .cache/member/dce-*.json .cache/member/em-*.json || true
          git add -f .cache/member/shfe-*.txt .cache/member/czce-*.txt || true
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore(cta): weekly backtest + seat backfill $(date -u +%Y%m%d)"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git push origin "HEAD:${{ github.ref_name }}"
